<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Messages — Beautiful SMS for Android</title>

<link rel="icon" href="assets/nova-logo.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>

/* =========================
   BASE
========================= */

:root{
  --bg:#050505;
  --text:#fff;
  --muted:#a1a1aa;

  --blue:#7cc5ff;
  --purple:#a78bfa;
  --pink:#fb7185;

  --border:rgba(255,255,255,.08);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Inter,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

.bg{
  position:fixed;
  inset:0;
  z-index:-10;
}

.blob{
  position:absolute;
  filter:blur(120px);
  opacity:.25;
  border-radius:999px;
  animation:glow 8s infinite ease-in-out;
}

.b1{width:500px;height:500px;background:var(--blue);top:-200px;left:-200px}
.b2{width:600px;height:600px;background:var(--purple);top:100px;right:-250px}
.b3{width:500px;height:500px;background:var(--pink);bottom:-200px;left:30%}

@keyframes glow{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.1)}
}

/* =========================
   LAYOUT
========================= */

.container{max-width:1200px;margin:auto;padding:0 24px}
section{padding:100px 0}

/* =========================
   NAV
========================= */

header{
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(20px);
  background:rgba(0,0,0,.6);
  border-bottom:1px solid var(--border);
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  height:70px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
}

.brand img{width:32px;height:32px}

.btn{
  padding:12px 18px;
  border-radius:999px;
  border:1px solid var(--border);
  text-decoration:none;
  color:white;
  display:inline-flex;
  align-items:center;
  gap:8px;
}

.primary{
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:#000;
  font-weight:700;
}

/* =========================
   HERO
========================= */

.hero{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
  align-items:center;
  min-height:90vh;
}

h1{
  font-size:70px;
  line-height:1;
}

.grad{
  background:linear-gradient(135deg,var(--blue),var(--purple),var(--pink));
  -webkit-background-clip:text;
  color:transparent;
}

p{color:var(--muted);margin-top:20px;font-size:18px}

.hero-actions{margin-top:30px;display:flex;gap:15px;flex-wrap:wrap}

/* =========================
   PHONES
========================= */

.phone-wrap{position:relative;height:600px}

.phone{
  position:absolute;
  border-radius:40px;
  overflow:hidden;
  box-shadow:0 40px 80px rgba(0,0,0,.5);
  animation:float 6s infinite ease-in-out;
}

.phone img{width:100%}

.p1{width:320px;left:50%;transform:translateX(-50%) rotate(-6deg)}
.p2{width:240px;left:0;top:120px;transform:rotate(-15deg)}
.p3{width:240px;right:0;top:150px;transform:rotate(12deg)}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

/* =========================
   SECTIONS
========================= */

.title{text-align:center;margin:auto}
.title h2{font-size:48px}

/* =========================
   FEATURES
========================= */

.features{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin-top:60px;
}

.card{
  padding:30px;
  border:1px solid var(--border);
  border-radius:24px;
  background:rgba(255,255,255,.04);
  transition:.3s;
}

.card:hover{
  transform:translateY(-10px);
}

/* =========================
   GALLERY
========================= */

.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
  margin-top:60px;
}

.gallery img{
  width:100%;
  border-radius:30px;
  transition:.3s;
}

.gallery img:hover{
  transform:scale(1.05);
}

/* =========================
   CTA
========================= */

.cta{
  text-align:center;
  padding:80px;
  border-radius:40px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
}

/* =========================
   ANIMATIONS
========================= */

.fade{
  opacity:0;
  transform:translateY(30px);
  transition:0.8s;
}

.fade.show{
  opacity:1;
  transform:translateY(0);
}

</style>
</head>

<body>

<div class="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<header>
<div class="container nav">
  <div class="brand">
    <img src="assets/nova-logo.png">
    Nova Messages
  </div>
  <a class="btn" href="https://github.com/TheOwn68/Nova-Messages">GitHub</a>
</div>
</header>

<section class="hero container fade">

  <div>

    <h1>
      Messaging <span class="grad">Reimagined</span>
    </h1>

    <p>
      Fast, private, open-source SMS for Android.
    </p>

    <div class="hero-actions">
      <a class="btn primary download-btn" href="#">Download</a>
      <a class="btn" href="#features">Features</a>
    </div>

  </div>

  <div class="phone-wrap">

    <div class="phone p2"><img src="assets/img2.png"></div>
    <div class="phone p1"><img src="assets/img1.png"></div>
    <div class="phone p3"><img src="assets/img4.png"></div>

  </div>

</section>

<section class="container fade">

  <div class="title">
    <h2>Why Nova?</h2>
  </div>

  <div class="features">

    <div class="card">⚡ Fast</div>
    <div class="card">🔒 Private</div>
    <div class="card">🚫 No Ads</div>
    <div class="card">🔍 Search</div>
    <div class="card">👥 Groups</div>
    <div class="card">🎨 Modern UI</div>

  </div>

</section>

<section class="container fade">

  <div class="title">
    <h2>Screenshots</h2>
  </div>

  <div class="gallery">
    <img src="assets/img1.png">
    <img src="assets/img2.png">
    <img src="assets/img4.png">
  </div>

</section>

<section class="container fade">

  <div class="cta">
    <h2>Download Nova Now</h2>
    <p>Open source. Free forever.</p>
    <br>
    <a class="btn primary download-btn" href="#">Download Latest</a>
  </div>

</section>

<script>
/* =========================
   GITHUB RELEASES
========================= */

(async () => {

  const repo = "TheOwn68/Nova-Messages";

  try {

    const r = await fetch(`https://api.github.com/repos/${repo}/releases/latest`);
    const release = await r.json();

    let apk = release.html_url;

    const asset = release.assets?.find(a => a.name.endsWith(".apk"));
    if(asset) apk = asset.browser_download_url;

    document.querySelectorAll(".download-btn").forEach(b=>{
      b.href = apk;
      b.textContent = "Download " + (release.tag_name || "");
    });

  } catch(e){}

})();

/* =========================
   SCROLL ANIMATION
========================= */

const observer = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add("show");
    }
  });
});

document.querySelectorAll(".fade").forEach(el=>{
  observer.observe(el);
});

</script>

</body>
</html>
